<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- TOP BAR -->

    <header class="topbar">

        <div>

            <h1 id="expenseTitle">
                Expense
            </h1>

            <p>
                Manage this expense
            </p>

        </div>


        <div class="topbar-actions">
            <button class="analysis-nav-btn" id="tabAnalysisButton">
                📊 Category Analysis
            </button>
            <a href="index.html"
               class="add-main-btn back-button">
                ← Home
            </a>
        </div>

    </header>



    <!-- EXPENSE PAGE -->

    <main class="expense-page">


        <!-- SELECTED TAB -->

        <section class="expense-header-card">

            <div>

                <p class="small-label">
                    Selected Expense
                </p>

                <h2 id="selectedName">
                    Expense
                </h2>

            </div>


            <div class="amount-box">

                <p>
                    Total Amount
                </p>

                <strong id="selectedAmount">
                    ₹0
                </strong>

            </div>

        </section>



        <!-- ADDED EXPENSES -->

        <section class="details-card">

            <div class="section-heading">

                <h2>
                    Expenses
                </h2>

                <button
                    class="add-button small-add"
                    id="addDetailButton">

                    + Add Expense

                </button>

            </div>


            <div id="expenseEntries">

                <!-- Added expenses appear here -->

            </div>

        </section>


    </main>



    <!-- ADD EXPENSE POPUP -->

    <div class="popup-overlay" id="detailPopup">

        <div class="popup">

            <button
                class="close-btn"
                id="closeDetailPopup">

                ×

            </button>


            <h2>
                Add Expense
            </h2>

            <p class="popup-subtitle">
                Add an expense to this selected tab
            </p>


            <form id="detailForm">


                <div class="form-group">

                    <label for="detailAmount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="detailAmount"
                        placeholder="₹ 0"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="detailCategory">
                        Category
                    </label>

                    <select id="detailCategory" required>
                        <option value="transport">🚗 Transport</option>
                        <option value="food">🍔 Food</option>
                        <option value="grocery">🛒 Grocery</option>
                        <option value="household">🏠 Household</option>
                        <option value="personal">👤 Personal</option>
                        <option value="school">📚 School</option>
                        <option value="health">🏥 Health</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="entertainment">🎮 Entertainment</option>
                        <option value="others" selected>📌 Others</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="detailDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="detailDate"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="detailDescription">
                        Description
                    </label>

                    <textarea
                        id="detailDescription"
                        placeholder="What was this expense for?"
                    ></textarea>

                </div>



                <button
                    type="submit"
                    class="add-button">

                    Add Expense

                </button>


            </form>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
